<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 144" role="img"><title>Reversão em V</title><desc>Subida seguida de queda e queda seguida de recuperação.</desc>
<defs><linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe4ba"/><stop offset=".48" stop-color="#db8e57"/><stop offset="1" stop-color="#f9c994"/></linearGradient><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0 10 5 0 10 2 5Z" fill="#f9c994"/></marker></defs>
<style>.wave{animation:float 6.4s ease-in-out infinite alternate}.w1{animation-delay:-3s}@keyframes float{from{transform:translateY(3px)}to{transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){.wave{animation:none}}</style>
<g class="wave w0" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M28 112 91 25 150 110" transform="translate(0 5)" stroke="#452b24" stroke-width="7" opacity=".45"/><path d="M28 112 91 25 150 110" stroke="#a45a35" stroke-width="7" opacity=".24"/><path d="M28 112 91 25 150 110" stroke="url(#c)" stroke-width="3.6" marker-end="url(#tip)"/><circle cx="91" cy="25" r="6" fill="#e69d62" opacity=".18"/><circle cx="91" cy="25" r="2.7" fill="#ffe1b6"/></g>
<g class="wave w1" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M207 31 267 117 331 30" transform="translate(0 5)" stroke="#452b24" stroke-width="7" opacity=".45"/><path d="M207 31 267 117 331 30" stroke="#a45a35" stroke-width="7" opacity=".24"/><path d="M207 31 267 117 331 30" stroke="url(#c)" stroke-width="3.6" marker-end="url(#tip)"/><circle cx="267" cy="117" r="6" fill="#e69d62" opacity=".18"/><circle cx="267" cy="117" r="2.7" fill="#ffe1b6"/></g></svg>
